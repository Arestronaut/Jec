name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: Test on macOS (Swift 6.2)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26 (Swift 6.2)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'

      - name: Show Swift version
        run: swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build (strict concurrency)
        run: swift build -Xswiftc -strict-concurrency=complete

      - name: Test (strict concurrency)
        run: swift test -Xswiftc -strict-concurrency=complete

  linux:
    name: Test on Linux (Swift 6.2)
    runs-on: ubuntu-latest
    container:
      image: swift:6.2-jammy
    steps:
      - uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build core target (Linux skips JecSwiftUI)
        run: swift build --target Jec -Xswiftc -strict-concurrency=complete

      - name: Test core suites
        run: swift test --filter JecTests -Xswiftc -strict-concurrency=complete

  ios-build:
    name: Build for iOS Simulator
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26 (Swift 6.2)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'

      - name: Show Swift version
        run: swift --version

      # Library build only — macro-expansion unit tests require the macOS host
      # (SwiftSyntax ships no iOS slice), and Xcode's SwiftPM integration does
      # not honor `.when(platforms:)` for testable macro plugin builds. Runtime
      # macro behavior (@Inject, @Module, @Injectable) is exercised by the
      # macOS and Linux test jobs above.
      - name: Build Jec
        run: xcodebuild build -scheme Jec -destination 'generic/platform=iOS Simulator'

      - name: Build JecSwiftUI
        run: xcodebuild build -scheme JecSwiftUI -destination 'generic/platform=iOS Simulator'
